<!DOCTYPE html>
<html lang="en" style="background: #FFFFFF;height: 100%">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="KLineChart example"/>
  <title>KLineChart + WebSocket</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/klinecharts/dist/klinecharts.js"></script>
  <!-- <script type="text/javascript" src="./kline.js"></script> -->
</head>
<body style="margin: 0;height: 100%">
<div class="d-flex flex-wrap" id="trading-pairs">
          {{range $val := .pairs}}
          <a style="margin: 2px;" href="/?pair={{ $val }}">{{ $val }}</a>
          {{end}}
        </div>
<div id="chart" style="height: 100%"></div>
<script>
    window.onload = function () {
        // 初始化图表
        var chart = klinecharts.init('chart')
        // 创建一个主图技术指标
        chart.createIndicator('MA', false, { id: 'candle_pane' })
        // 创建一个副图技术指标VOL
        chart.createIndicator('VOL')
        // 创建一个副图技术指标MACD
        chart.createIndicator('MACD')
      
        function drawIndicator(cfg) {
          var calcParams =[]
          var figures  =[]
          cfg.metrics.forEach(element => {
            var valset = {}
            for (let i = 0; i < element.value.length; i++) {
              valset[new Date(element.time[i]).getTime()] = element.value[i]
            }
            figures.push({ key: element.name, title: element.name+":", type:element.style,values:valset })
          });

          const indicatorCfg = {
              name: cfg.name,
              shortName: cfg.name,
              calcParams: calcParams,
              figures: figures,
              calc: (dataList, indicator) => {
                return dataList.map((kLineData, i) => {
                  const figureData = {}
                  figures.forEach((figure, index) => {
                    figureData[figure.key] = figure.values[kLineData.timestamp]
                  })
                  return figureData
                })
              }
          };
          
          klinecharts.registerIndicator(indicatorCfg);
          // 创建副图指标
          chart.createIndicator(cfg.name, false, { id: cfg.name });
        }
        // WebSocket 连接
        const urlParams = new URLSearchParams(window.location.search);
        const pair = urlParams.get('pair');
        var ws = new WebSocket('ws://localhost:8080/ws?pair='+pair); 
        ws.onopen = function() {
            console.log('Connected to WebSocket');
        };

        ws.onmessage = function(event) {
            try {
                var message = JSON.parse(event.data);
                // 处理 initialData
                if (message.type === 'initialData' && message.payload) {
                    if (message.payload.candles) {
                        var chartDataList = message.payload.candles.map(function (item) {
                          var ts = new Date(item.time).getTime()
                            for (const order of item.orders) {
                              chart.createOverlay({
                                  name: 'simpleAnnotation',
                                 // styles: { color: '#a0a7e6' },
                                  extendData:function(data){
                                    return order.side[0]
                                  },
                                  points: [{ timestamp: ts, value: order.price }]
                                })
                            }
                            return {
                                timestamp: ts,
                                open: item.open,
                                high: item.high,
                                low: item.low,
                                close: item.close,
                                volume: item.volume
                            }
                        });
                        chart.applyNewData(chartDataList);
                    }
                    
                    // if (message.payload.asset_values) {
                    //     drawIndicator({name:'Cash_INDICATOR',shortName:'现金'}, message.payload.asset_values);
                    //     // 创建副图指标
                    //    // chart.createIndicator('Cash_INDICATOR', false, { id: 'new_pane' });
                    // }
                    if (message.payload.indicators) {
                      for (const indicator of message.payload.indicators) {
                        drawIndicator(indicator);
                      }
                    }
                }
            } catch (e) {
                console.error('Error parsing message:', e);
            }
        };

        ws.onerror = function(err) {
            console.error('WebSocket error:', err);
        };
        
        ws.onclose = function() {
            console.log('WebSocket connection closed');
        };
    }
</script>
</body>
</html>
